
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>SVG Animation | Baby</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header>
    <nav class="site-nav">
      <div class="content-wrapper">
        <a href="index.html" class="logo">Baby</a>

        <ul>
          <li><a href="resume.html">Resume</a></li>
          <li><a href="projects.html">Projects</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <main class="content-wrapper">
    <h1>SVG Animation</h1>

    <p>
      This project showcases an SVG illustration
      animated using CSS.
    </p>

    <section class="svg-project">
      <h2>My SVG Illustration</h2>
      <p>
        This illustration uses six animated shapes
        to create a smooth animation.
      </p>

      <svg
        id="flower"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 352.54 399"
        role="img"
        aria-label="Red flower with six petals and a yellow centre"
      >
        <defs>
          <style>
            .cls-1 {
              fill: #f5e5a5;
            }

            .cls-1, .cls-2, .cls-3 {
              stroke: #c1272d;
            }

            .cls-1, .cls-3 {
              stroke-width: 3px;
            }

            .cls-2 {
              stroke-miterlimit: 4;
              stroke-width: 3px;
            }

            .cls-2, .cls-3 {
              fill: #c1272d;
            }
          </style>
        </defs>

        <ellipse id="petal-1" class="cls-3"
          cx="176.27" cy="105.5"
          rx="49" ry="104"/>

        <ellipse id="petal-2" class="cls-2"
          cx="257.68" cy="152.5"
          rx="104" ry="49"
          transform="translate(-41.73 149.27) rotate(-30)"/>

        <ellipse id="petal-3" class="cls-2"
          cx="257.68" cy="246.5"
          rx="49" ry="104"
          transform="translate(-84.64 346.4) rotate(-60)"/>

        <ellipse id="petal-4" class="cls-3"
          cx="176.27" cy="293.5"
          rx="49" ry="104"/>

        <ellipse id="petal-5" class="cls-2"
          cx="94.86" cy="246.5"
          rx="104" ry="49"
          transform="translate(-110.54 80.46) rotate(-30)"/>

        <ellipse id="petal-6" class="cls-2"
          cx="94.86" cy="152.5"
          rx="49" ry="104"
          transform="translate(-84.64 158.4) rotate(-60)"/>

        <circle id="flower-centre" class="cls-1"
          cx="176.27" cy="199.5" r="53"/>
      </svg>
    </section>
  </main>

  <footer>
    <p>SVG Animation - Baby</p>
  </footer>
</body>
</html>
